name: Provision

# Applies infra/main.bicep (azd provision, project file azure.yaml) to one environment, by hand:
# it changes Azure resources, not the application. The template rewrites the Function App's
# settings, so the release running before is deployed again afterwards (its own settings back).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        required: true
        default: staging
        options: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ONEPASSWORD_VAULT: Azure-Infra-Secret
  ONEPASSWORD_ITEM: tekad-frais-infra

jobs:
  provision:
    name: Provision ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Its own GitHub environment, so its own, broader identity: it creates and changes every
    # resource of the group, and grants the Key Vault roles.
    environment: ${{ inputs.environment }}-infra
    outputs:
      running: ${{ steps.running.outputs.version }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Granted Key Vault Secrets Officer by main.bicep: the deploy identity.
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
      - name: Parameters (infra/env + 1Password)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          grep -Ev '^\s*(#|$)' "infra/env/$ENVIRONMENT.env" >> "$GITHUB_ENV"
          deploy/scripts/op-env.sh env "op://$ONEPASSWORD_VAULT/$ONEPASSWORD_ITEM.$ENVIRONMENT.provision/notesPlain"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Release running now
        id: running
        run: |
          rg="rg-$AZURE_RESOURCE_TOKEN"
          func="$(az functionapp list -g "$rg" --query "[?tags.\"azd-service-name\"=='api'].name | [0]" -o tsv 2>/dev/null || true)"
          version=""
          [ -z "$func" ] || version="$(az functionapp config appsettings list -g "$rg" -n "$func" --query "[?name=='APP_VERSION'].value | [0]" -o tsv)"
          echo "version=${version:+v$version}" >> "$GITHUB_OUTPUT"
          echo "Running: ${version:-nothing yet}"
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
      - name: Provision
        run: |
          azd auth login --federated-credential-provider github --client-id "${{ vars.AZURE_CLIENT_ID }}" --tenant-id "${{ vars.AZURE_TENANT_ID }}"
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt 2>/dev/null || azd env select "$AZURE_ENV_NAME"
          # Resource-group deployment, into the group infra/scripts/github-oidc.sh created.
          azd env set AZURE_RESOURCE_GROUP "rg-$AZURE_RESOURCE_TOKEN"
          azd provision --no-prompt
          {
            echo "### Provision ${ENVIRONMENT}"
            azd env get-values | grep -E '^(AZURE_RESOURCE_GROUP|FUNCTION_APP_NAME|STATIC_WEB_APP_HOSTNAME|KEY_VAULT_NAME|POSTGRES_FQDN)='
          } >> "$GITHUB_STEP_SUMMARY"

  redeploy:
    name: Settings of the running release back
    needs: provision
    if: needs.provision.outputs.running != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ needs.provision.outputs.running }}
    secrets: inherit
